<svg width="640" height="830" viewBox="0 0 640 830" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="830" rx="20" fill="url(#bg)"/>

  <!-- Connectors -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)">
    <!-- box1 -> box2 -->
    <line x1="320" y1="90"  x2="320" y2="116"/>
    <!-- box2 -> branch -->
    <line x1="320" y1="180" x2="320" y2="210"/>
    <!-- branch -> STM32 / ESP32 -->
    <line x1="320" y1="210" x2="190" y2="236"/>
    <line x1="320" y1="210" x2="450" y2="236"/>
    <!-- STM32 / ESP32 -> merge -->
    <line x1="190" y1="300" x2="320" y2="326"/>
    <line x1="450" y1="300" x2="320" y2="326"/>
    <!-- merge -> box4 -->
    <line x1="320" y1="328" x2="320" y2="356"/>
    <!-- box4 -> box5 -->
    <line x1="320" y1="420" x2="320" y2="446"/>
    <!-- box5 -> box6 -->
    <line x1="320" y1="530" x2="320" y2="556"/>
    <!-- box6 -> box7 -->
    <line x1="320" y1="620" x2="320" y2="646"/>
    <!-- box7 -> box8 -->
    <line x1="320" y1="710" x2="320" y2="736"/>
  </g>

  <!-- Box 1: Embedded C/C++ -->
  <rect x="130" y="30" width="380" height="60" rx="12" fill="#172554" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="66" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Embedded C/C++</text>

  <!-- Box 2: Microcontroller Firmware -->
  <rect x="130" y="120" width="380" height="60" rx="12" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Microcontroller Firmware</text>

  <!-- Box 3a: STM32 -->
  <rect x="90" y="240" width="200" height="60" rx="12" fill="#1D4ED8" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="190" y="277" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">STM32</text>

  <!-- Box 3b: ESP32 -->
  <rect x="350" y="240" width="200" height="60" rx="12" fill="#2563EB" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="450" y="277" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">ESP32</text>

  <!-- Box 4: FreeRTOS / Drivers -->
  <rect x="130" y="360" width="380" height="60" rx="12" fill="#3B82F6" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="396" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">FreeRTOS / Drivers</text>

  <!-- Box 5: Communication Protocols -->
  <rect x="130" y="450" width="380" height="80" rx="12" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="481" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Communication Protocols</text>
  <text x="320" y="508" text-anchor="middle" fill="#E0F2FE" font-size="16" font-family="Arial, Helvetica, sans-serif">UART &#8226; SPI &#8226; I2C &#8226; MQTT</text>

  <!-- Box 6: Embedded Linux -->
  <rect x="130" y="560" width="380" height="60" rx="12" fill="#0EA5E9" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="596" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Embedded Linux</text>

  <!-- Box 7: Buildroot -->
  <rect x="130" y="650" width="380" height="60" rx="12" fill="#6366F1" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="686" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Buildroot</text>

  <!-- Box 8: Edge / IoT Systems -->
  <rect x="130" y="740" width="380" height="60" rx="12" fill="#4338CA" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="320" y="776" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Edge / IoT Systems</text>

  <!-- Decorative dots -->
  <circle cx="40" cy="40" r="4" fill="#38BDF8" opacity="0.5"/>
  <circle cx="600" cy="790" r="4" fill="#6366F1" opacity="0.5"/>
</svg>
