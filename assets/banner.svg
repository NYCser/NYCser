<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>

  <!-- Decorative circuit lines -->
  <path d="M0 240 H180 V200 H280 V230 H360" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M1200 70 H1020 V110 H930 V85 H860" stroke="#6366F1" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 60 H120 V90 H220" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.25"/>
  <path d="M1200 250 H1080 V220 H1000" stroke="#6366F1" stroke-width="2" fill="none" opacity="0.25"/>

  <circle cx="180" cy="240" r="5" fill="#38BDF8"/>
  <circle cx="1020" cy="70" r="5" fill="#6366F1"/>
  <circle cx="120" cy="60" r="4" fill="#38BDF8" opacity="0.6"/>
  <circle cx="1080" cy="250" r="4" fill="#6366F1" opacity="0.6"/>

  <!-- Main title -->
  <text x="600" y="120" text-anchor="middle" fill="#FFFFFF" font-size="52"
        font-weight="bold" font-family="Arial, Helvetica, sans-serif">
    Cao Như Ý
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" fill="#CBD5E1" font-size="23"
        font-family="Arial, Helvetica, sans-serif">
    Embedded Systems • Firmware • Embedded Linux • IoT
  </text>

  <!-- Accent line -->
  <rect x="440" y="188" width="320" height="3" rx="2" fill="url(#line)"/>

  <!-- Small text -->
  <text x="600" y="230" text-anchor="middle" fill="#94A3B8" font-size="16"
        font-family="Arial, Helvetica, sans-serif">
    C/C++ • STM32 • ESP32 • FreeRTOS • Linux • Buildroot • MQTT
  </text>
</svg>
